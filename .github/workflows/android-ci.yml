name: Android CI
# Validate BLE and Health Connect integration for each phase PR

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main
      - feat/ble-readonly-proof-of-concept
      - 'feat/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android Lint
        id: lint
        run: gradle --no-daemon lintDebug

      - name: Run unit tests and assemble APK
        id: build
        if: always() && steps.setup_gradle.outcome == 'success'
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Publish debug APK artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: relogio-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android Lint report
        if: always() && steps.setup_gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
