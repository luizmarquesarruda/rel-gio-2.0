name: Android CI
# Validate BLE and Health Connect integration for each phase PR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'fix/**'
      - feat/ble-readonly-proof-of-concept
      - 'feat/**'
      - 'docs/**'
      - 'work/**'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run APK manifest policy unit tests
        id: manifest_policy_tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # AGP 8.13.2 is paired with Gradle 8.13. Gradle 9.x is not
          # the supported toolchain for this Android Gradle Plugin line.
          gradle-version: "8.13"

      - name: Bootstrap Gradle dependency verification metadata
        id: dependency_verification_bootstrap
        if: ${{ !hashFiles('gradle/verification-metadata.xml') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "generated=true" >> "$GITHUB_OUTPUT"
          gradle --no-daemon --write-verification-metadata sha256 lintDiagnosticDebug lintCompanionDebug testDiagnosticDebugUnitTest testCompanionDebugUnitTest assembleDiagnosticDebug assembleCompanionDebug :macrobenchmark:assemble

      - name: Publish Gradle verification bootstrap for review
        if: ${{ steps.dependency_verification_bootstrap.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-dependency-verification-bootstrap
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap KtLint baseline for existing style debt
        id: ktlint_baseline_bootstrap
        if: ${{ !hashFiles('app/config/ktlint/baseline.xml') }}
        run: gradle --no-daemon :app:ktlintGenerateBaseline

      - name: Publish KtLint baseline for review
        if: ${{ steps.ktlint_baseline_bootstrap.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-baseline-review
          path: app/config/ktlint/baseline.xml
          if-no-files-found: error
          retention-days: 30

      - name: Run KtLint as a blocking source gate
        id: ktlint
        run: gradle --no-daemon :app:ktlintCheck

      - name: Run Android Lint for both variants
        id: lint
        run: gradle --no-daemon lintDiagnosticDebug lintCompanionDebug

      - name: Run unit tests and assemble both variants
        id: build
        # When verification metadata is absent, the bootstrap already performs
        # these exact tests/builds. Do not run the same failing Gradle graph twice.
        if: ${{ !cancelled() && steps.setup_gradle.outcome == 'success' && steps.manifest_policy_tests.outcome == 'success' && steps.dependency_verification_bootstrap.outcome == 'skipped' }}
        run: gradle --no-daemon testDiagnosticDebugUnitTest testCompanionDebugUnitTest assembleDiagnosticDebug assembleCompanionDebug :macrobenchmark:assemble

      - name: Enforce privacy dependency and permission guardrails
        id: privacy_guardrails
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.dependency_verification_bootstrap.outcome == 'success') && steps.manifest_policy_tests.outcome == 'success' }}
        run: bash scripts/check-privacy-guardrails.sh

      - name: Audit merged APK manifests, signatures and hashes
        id: audit_apks
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.dependency_verification_bootstrap.outcome == 'success') && steps.privacy_guardrails.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK path unavailable" >&2
            exit 1
          fi

          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK_ANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for tool in AAPT APK_ANALYZER APKSIGNER; do
            if [[ -z "${!tool}" ]]; then
              echo "Required Android SDK tool not found: $tool" >&2
              exit 1
            fi
          done

          REPORT_DIR="app/build/reports/security"
          mkdir -p "$REPORT_DIR"
          for variant in diagnostic companion; do
            apk="app/build/outputs/apk/$variant/debug/app-$variant-debug.apk"
            if [[ ! -f "$apk" ]]; then
              echo "Expected APK not found: $apk" >&2
              exit 1
            fi

            manifest="$REPORT_DIR/$variant-manifest.xml"
            "$APK_ANALYZER" manifest print "$apk" > "$manifest"
            python3 scripts/audit_apk_manifest.py --variant "$variant" --manifest "$manifest"

            "$AAPT" dump permissions "$apk" > "$REPORT_DIR/$variant-permissions.txt"
            "$AAPT" dump badging "$apk" > "$REPORT_DIR/$variant-badging.txt"

            signature="$REPORT_DIR/$variant-signature.txt"
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$signature" 2>&1
            if ! grep -Eq 'Verified using v2 scheme.*: true' "$signature"; then
              echo "APK v2 signature verification did not succeed for $variant." >&2
              cat "$signature" >&2
              exit 1
            fi

            sha256sum "$apk" > "$REPORT_DIR/$variant-sha256.txt"
          done

          echo "Both APK variants passed manifest policy and APK signature verification."

      - name: Prepare diagnostic APK metadata in the reports artifact
        id: prepare_diagnostic_package
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.dependency_verification_bootstrap.outcome == 'success') && steps.lint.outcome == 'success' && steps.privacy_guardrails.outcome == 'success' && steps.audit_apks.outcome == 'success' }}
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          GRADLE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$APP_VERSION" || "$GRADLE_VERSION" != "$APP_VERSION" ]]; then
            echo "VERSION ($APP_VERSION) diverges from app/build.gradle.kts ($GRADLE_VERSION)." >&2
            exit 1
          fi

          SOURCE_APK="app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk"
          REPORT_DIR="app/build/reports/security"
          if [[ ! -s "$SOURCE_APK" ]]; then
            echo "Diagnostic APK is missing or empty: $SOURCE_APK" >&2
            exit 1
          fi
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/diagnostic-build-info.txt" <<EOF
          app=Relógio 2.0
          variant=diagnosticDebug
          package=com.luizmarquesarruda.relogio20.diagnostic
          version=${APP_VERSION}-diagnostic
          build_type=debug
          source_commit=$SOURCE_COMMIT
          tested_commit=$GITHUB_SHA
          workflow_run=$GITHUB_RUN_ID
          notification_listener=absent
          internet_permission=present_weather_api_only
          release_ready=false
          EOF

      - name: Publish diagnostic APK only
        if: ${{ !cancelled() && success() && steps.prepare_diagnostic_package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: relogio-2.0-diagnostic-debug-apk
          # This artifact is intentionally a single installable APK file.
          path: app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android validation reports
        if: ${{ !cancelled() && steps.setup_gradle.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports
          path: |
            app/build/reports/lint-results-diagnosticDebug.html
            app/build/reports/lint-results-diagnosticDebug.xml
            app/build/reports/lint-results-diagnosticDebug.sarif
            app/build/reports/lint-results-companionDebug.html
            app/build/reports/lint-results-companionDebug.xml
            app/build/reports/lint-results-companionDebug.sarif
            app/build/reports/security/**
            app/build/reports/ktlint/**
          if-no-files-found: warn
          retention-days: 30
