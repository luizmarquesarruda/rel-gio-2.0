name: Android CI

on:
  pull_request:
    branches:
      - main
      - feat/ble-readonly-proof-of-concept
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relogio-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
