name: Prepare Gradle wrapper, verification metadata and Kotlin formatting
on:
  push:
    branches:
      - fix/security-privacy-gatt-20261109
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify the committed Gradle 8.13 wrapper
        run: |
          set -euo pipefail
          test -x gradlew
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          grep -F "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version
      - name: Apply ktlint formatting
        id: format
        continue-on-error: true
        run: ./gradlew --no-daemon :app:ktlintFormat
      - name: Verify formatted Kotlin sources
        id: ktlint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:ktlintCheck
      - name: Export formatted Kotlin sources and KtLint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-format-debug-snapshot
          path: |
            app/src/**/*.kt
            app/build/reports/ktlint/**
            app/build/reports/**
            app/build/test-results/**
            gradlew
            gradlew.bat
            gradle/wrapper/**
          if-no-files-found: error
          retention-days: 3
      - name: Generate SHA-256 dependency verification metadata and validate project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.format.outcome }}" != "success" || "${{ steps.ktlint.outcome }}" != "success" ]]; then
            echo "Formatter and KtLint must both pass before dependency metadata can be trusted."
            exit 1
          fi
          ./gradlew --no-daemon --write-verification-metadata sha256 lintDiagnosticDebug lintCompanionDebug testDiagnosticDebugUnitTest testCompanionDebugUnitTest assembleDiagnosticDebug assembleCompanionDebug :macrobenchmark:assemble
      - name: Export generated SHA-256 dependency metadata for review
        if: ${{ always() && hashFiles('gradle/verification-metadata.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-verification-metadata-review
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7
      - name: Commit formatted sources and Gradle wrapper for iterative review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper app/src
          if git diff --cached --quiet; then
            echo "No generated tooling or formatting changes."
            exit 0
          fi
          git commit -m "style: apply Kotlin formatter and pin Gradle wrapper"
          git push origin HEAD:fix/security-privacy-gatt-20261109
